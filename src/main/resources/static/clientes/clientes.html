<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Libre - Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="clientes.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
            <h4 class="text-center fw-bold mb-4 text-info">
                <i class="bi bi-bicycle"></i> Rueda Libre
            </h4>
            <a href="../index.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="../alquileres/nuevo.html"><i class="bi bi-calendar-check me-2"></i> Alquileres</a>
            <a href="clientes.html" class="active"><i class="bi bi-people me-2"></i> Clientes</a>
            <a href="../inventario/equipos.html"><i class="bi bi-scooter me-2"></i> Equipos</a>
            <a href="../inventario/accesorios.html"><i class="bi bi-tools me-2"></i> Accesorios / Taller</a>
            <a href="../reportes/reportes.html"><i class="bi bi-file-earmark-pdf me-2"></i> Reportes PDF</a>
        </nav>

        <!-- Contenido Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom">
                <h2 class="h3">Gestión de Clientes</h2>
                <button class="btn btn-primary" onclick="abrirModalCrear()">
                    <i class="bi bi-person-plus me-1"></i> Nuevo Cliente
                </button>
            </div>

            <!-- Tabla de Clientes -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0">Directorio de Clientes</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Correo Electrónico</th>
                                <th>Saldo Pendiente</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody id="cuerpoTablaClientes">
                            <!-- Los datos se inyectarán aquí con JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal para Crear/Editar Cliente -->
<div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formCliente">
                <div class="modal-header bg-light">
                    <h5 class="modal-title" id="tituloModal">Registrar Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Alerta para errores -->
                    <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

                    <!-- Campo oculto para saber si estamos editando o creando -->
                    <input type="hidden" id="clienteId">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" id="nombreCliente" class="form-control" placeholder="Ej. Ana Morales" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" id="emailCliente" class="form-control" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="alert alert-info py-2 mb-0 border-0" role="alert">
                        <small><i class="bi bi-info-circle me-1"></i> El saldo inicial será de Q 0.00 automáticamente.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="clientes.js"></script>
</body>
</html>
