<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Libre - Gestión de Equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="equipos.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
            <h4 class="text-center fw-bold mb-4 text-info">
                <i class="bi bi-bicycle"></i> Rueda Libre
            </h4>
            <a href="../index.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="../alquileres/nuevo.html"><i class="bi bi-calendar-check me-2"></i> Alquileres</a>
            <a href="../clientes/clientes.html"><i class="bi bi-people me-2"></i> Clientes</a>
            <a href="equipos.html" class="active"><i class="bi bi-scooter me-2"></i> Equipos</a>
            <a href="accesorios.html"><i class="bi bi-tools me-2"></i> Accesorios / Taller</a>
            <a href="../reportes/reportes.html"><i class="bi bi-file-earmark-pdf me-2"></i> Reportes PDF</a>
        </nav>

        <!-- Contenido Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom">
                <h2 class="h3">Gestión de Equipos (Inventario)</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoEquipo">
                    <i class="bi bi-plus-circle me-1"></i> Agregar Equipo
                </button>
            </div>

            <!-- Tabla de Equipos -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0">Catálogo de Equipos Registrados</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tipo</th>
                                <th>Modelo</th>
                                <th>Tarifa (x Hora)</th>
                                <th>Reposición</th>
                                <th>Batería</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody id="cuerpoTablaEquipos">
                            <!-- Los datos se inyectarán aquí con JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal para Registrar Nuevo Equipo -->
<div class="modal fade" id="modalNuevoEquipo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formNuevoEquipo">
                <div class="modal-header bg-light">
                    <h5 class="modal-title">Registrar Nuevo Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Alerta para mostrar errores del backend -->
                    <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tipo de Equipo</label>
                        <select id="tipoEquipo" class="form-select" required>
                            <option value="">Seleccione...</option>
                            <option value="Bicicleta Urbana">Bicicleta Urbana</option>
                            <option value="Bicicleta Eléctrica">Bicicleta Eléctrica</option>
                            <option value="Scooter Eléctrico">Scooter Eléctrico</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Modelo / Marca</label>
                        <input type="text" id="modeloEquipo" class="form-control" placeholder="Ej. Xiaomi Mi Pro 2" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tarifa por Hora (Q)</label>
                            <input type="number" step="0.01" id="tarifaEquipo" class="form-control" min="0.01" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Precio Reposición (Q)</label>
                            <input type="number" step="0.01" id="reposicionEquipo" class="form-control" min="0.01" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nivel de Batería (%)</label>
                        <input type="number" id="bateriaEquipo" class="form-control" min="0" max="100" value="100" required>
                        <small class="text-muted">Si no es eléctrico, déjalo en 0 o 100.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Equipo</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="equipos.js"></script>
</body>
</html>
