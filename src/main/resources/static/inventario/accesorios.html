<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Libre - Gestión de Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="accesorios.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
            <h4 class="text-center fw-bold mb-4 text-info"><i class="bi bi-bicycle"></i> Rueda Libre</h4>
            <a href="../index.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="../alquileres/nuevo.html"><i class="bi bi-calendar-check me-2"></i> Alquileres</a>
            <a href="../clientes/clientes.html"><i class="bi bi-people me-2"></i> Clientes</a>
            <a href="equipos.html"><i class="bi bi-scooter me-2"></i> Equipos</a>
            <a href="accesorios.html" class="active"><i class="bi bi-tools me-2"></i> Accesorios</a>
            <a href="../reportes/reportes.html"><i class="bi bi-file-earmark-pdf me-2"></i> Reportes PDF</a>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom">
                <h2 class="h3">Catálogo de Accesorios</h2>
                <button class="btn btn-primary" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-circle me-1"></i> Agregar Accesorio
                </button>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre del Accesorio</th>
                                <th>Tarifa Fija (Q)</th>
                                <th>Reposición (Q)</th>
                                <th>Existencia Actual</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody id="cuerpoTablaAccesorios">
                            <!-- El JavaScript inyectará las 6 columnas aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal para Crear/Editar -->
<div class="modal fade" id="modalAccesorio" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formAccesorio">
                <div class="modal-header bg-light">
                    <h5 class="modal-title" id="tituloModal">Registrar Accesorio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="alertaError" class="alert alert-danger d-none"></div>
                    <input type="hidden" id="accesorioId">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Accesorio</label>
                        <input type="text" id="nombreAcc" class="form-control" placeholder="Ej. Casco Urbano M" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tarifa Fija (Q)</label>
                            <input type="number" step="0.01" id="tarifaAcc" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Precio Reposición (Q)</label>
                            <input type="number" step="0.01" id="reposicionAcc" class="form-control" min="0.01" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Existencia Actual</label>
                        <!-- Mantenemos el id="stockAcc" para que no se rompa la conexión con el archivo accesorios.js -->
                        <input type="number" id="stockAcc" class="form-control" min="0" value="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="accesorios.js"></script>
</body>
</html>
